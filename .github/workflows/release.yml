# ============================================================================
# Release · 打 tag 自动出包并发布 GitHub Release（应用内"检查更新"的数据源）
#
# 触发：推送 v* 标签（如 v1.1.0）或手动 workflow_dispatch
#
# 产物命名与 lib/services/update_service.dart 的资产选择约定一一对应：
#   prompt-optimizer-linux-x64-<ver>.tar.gz
#   prompt-optimizer-windows-x64-<ver>.zip
#   prompt-optimizer-<ver>-universal.apk
#   SHA256SUMS.txt（应用更新时用于完整性校验）
# ============================================================================
name: Release · 出包并发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  build-linux:
    name: 打包 · Linux (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 GTK3 构建依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            cmake ninja-build pkg-config clang libgtk-3-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter build linux --release

      - name: 打包 tar.gz
        run: |
          set -e
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p dist
          tar -czf "dist/prompt-optimizer-linux-x64-${VERSION}.tar.gz" \
            -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: 打包 · Windows (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter build windows --release

      - name: 打包 zip
        shell: bash
        run: |
          set -e
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p dist
          7z a -bd "dist/prompt-optimizer-windows-x64-${VERSION}.zip" \
            ./build/windows/x64/runner/Release/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  build-android:
    name: 打包 · Android (universal APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 配置 release 签名（可选）
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$KS_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "✅ 已注入 release 签名配置"
          else
            echo "ℹ️ 未配置签名 Secrets，使用 debug 签名回退"
          fi

      - run: yes | flutter doctor --android-licenses >/dev/null || true

      # universal APK（非 split）：应用内更新按单包安装
      - name: 构建 universal APK
        run: |
          set -e
          flutter build apk --release

      - name: 归集产物
        run: |
          set -e
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/prompt-optimizer-${VERSION}-universal.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成 SHA256SUMS.txt + 版本一致性校验
        run: |
          set -e
          VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          TAG="${GITHUB_REF_NAME}"
          # 手动触发时 ref 是分支名，回退到 pubspec 版本
          if [[ "$TAG" != v* ]]; then TAG="v${VERSION}"; fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "❌ 标签 ${TAG} 与 pubspec 版本 v${VERSION} 不一致，拒绝发布"
            exit 1
          fi
          cd dist && sha256sum * > SHA256SUMS.txt
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "📦 发布产物："
          ls -lh

      - name: 创建 GitHub Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "提示词优化工具 ${TAG}" \
              --generate-notes
          fi
